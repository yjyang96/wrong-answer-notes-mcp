[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-service"
version = "1.0.0"
description = "Text embedding generation service for commit data"
authors = [{name = "Dev Agent", email = "dev@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.12.0",
    "azure-ai-openai>=1.0.0b1",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "pydantic>=2.5.0",
    "aiohttp>=3.9.1",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "tqdm>=4.66.1",
    "loguru>=0.7.2",
    "scikit-learn>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
]

[project.scripts]
embedding-cli = "src.cli.main:cli"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
